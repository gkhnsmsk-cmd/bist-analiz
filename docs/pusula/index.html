<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Pusula — BIST Mobil</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { margin: 0; overscroll-behavior-y: none; background: #f9fafb; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  input, select, textarea, button { font-size: 16px; } /* iOS otomatik yakınlaştırmayı engeller */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  .detay-anim { animation: slideUp .24s cubic-bezier(.22,.9,.35,1); }
  .fade-anim { animation: fadeIn .18s ease; }
  .pop-anim { animation: popIn .18s cubic-bezier(.22,.9,.35,1); }
  /* "Anlık" fiyat güncellenince döviz.com tarzı yanıp-sönme (flash) —
     yükseldiyse yeşile, düştüyse kırmızıya kısa bir parlama yapıp normale
     döner. Sadece renk/arka plan animasyonu, metin sıçramaz (layout shift yok). */
  @keyframes flashYesil { 0% { background-color: rgba(16,185,129,.28); } 100% { background-color: transparent; } }
  @keyframes flashKirmizi { 0% { background-color: rgba(239,68,68,.28); } 100% { background-color: transparent; } }
  .fiyat-flash-yukari { animation: flashYesil 900ms ease-out; border-radius: .5rem; }
  .fiyat-flash-asagi { animation: flashKirmizi 900ms ease-out; border-radius: .5rem; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

// Anlık fiyat sorgulama sıklığı — döviz.com tarzı "yanıp sönen" his için
// yeterince sık, ama Cloudflare Worker'ın ücretsiz kotasını (günde 100.000
// istek) zorlamayacak kadar seyrek. Panel açık olduğu sürece çalışır,
// kapanınca durur.
const CANLI_FIYAT_YENILEME_MS = 5000;

/* ═══════════════════════════════════════════════════════════════════════
   PUSULA — BIST mobil arayüzü (React SPA, Streamlit'in yerini alır)
   ───────────────────────────────────────────────────────────────────────
   NEDEN BU DOSYA VAR: Streamlit her dokunuşta sayfayı Python tarafında
   baştan çiziyor (rerun) — bu, mobilde ekran geçişlerinin "anlık" değil
   "yenileniyor" hissi vermesinin, iç içe kaydırma kutularının ve menünün
   içerik altında kaybolmasının kök nedeniydi. CSS yamalarıyla düzelmiyor,
   çünkü mimari sorun. Bu dosya YERİNE geçen bağımsız bir SPA: ekran
   geçişleri saf React state ile (Python'a hiç gidilmeden) anında olur.

   VERİ KAYNAĞI (MOCK DEĞİL): Bu sayfa docs/pusula/data/*.json dosyalarını
   fetch() ile okur. O dosyalar pusula_veri_uret.py tarafından
   tarama_onbellek.json (Öne Çıkan + Yükselebilecek taramaları) ve
   sanal_portfoy.json'dan üretilir — arka_plan_tarama.py ve
   gunluk_sanal_yatirim.py her çalıştığında (Görev Zamanlayıcı / GitHub
   Actions) otomatik tazelenir. Ağ isteği başarısız olursa (ör. dosyalar
   henüz commit'lenmemişse) sayfa MOCK_HISSELER'e düşer ki boş kalmasın. */

const MOCK_HISSELER = [
  { symbol: 'PGSUS', ad: 'Pegasus Hava Taşımacılığı', fiyat: 985.50, degisim: 3.2, trend: 'Güçlü Al', favori: true },
  { symbol: 'ASTOR', ad: 'Astor Enerji',               fiyat: 112.40, degisim: -1.1, trend: 'Tut',      favori: true },
  { symbol: 'THYAO', ad: 'Türk Hava Yolları',           fiyat: 315.25, degisim: 1.8, trend: 'Al',        favori: true },
  { symbol: 'TUPRS', ad: 'Tüpraş',                      fiyat: 178.90, degisim: -2.4, trend: 'Sat',       favori: false },
  { symbol: 'GARAN', ad: 'Garanti BBVA',                fiyat: 142.10, degisim: 0.6, trend: 'Al',        favori: false },
  { symbol: 'AKBNK', ad: 'Akbank',                      fiyat: 98.35,  degisim: -0.4, trend: 'Tut',      favori: false },
  { symbol: 'ASELS', ad: 'Aselsan',                     fiyat: 210.75, degisim: 4.1, trend: 'Güçlü Al',  favori: false },
  { symbol: 'BIMAS', ad: 'BİM Mağazalar',               fiyat: 645.00, degisim: -3.7, trend: 'Güçlü Sat', favori: false },
  { symbol: 'EREGL', ad: 'Ereğli Demir Çelik',          fiyat: 56.20,  degisim: 1.2, trend: 'Al',        favori: false },
  { symbol: 'KCHOL', ad: 'Koç Holding',                 fiyat: 298.60, degisim: 0.2, trend: 'Tut',       favori: false },
];

/* Gerçek veriyi Pusula'nın beklediği alan adlarına çevirir. Kaynak
   (pusula_veri_uret.py) 'degisim1ay' üretir — gerçek anlık günlük değişim
   önbellekte yok, bu yüzden rozetler 1 aylık değişimi gösterir; ekran
   başlıklarında bu açıkça belirtilir (aşağıya bkz.). */
/* "Bu veri ne kadar taze?" — kullanıcı isteği: hisseye tıklayınca ne zaman
   güncellendiğini (X dakika/saat/gün önce + tam tarih-saat) görebilsin.
   ISO zaman damgasını göreli metne çevirir; null/parse edilemezse null döner
   (çağıran taraf o zaman hiçbir şey göstermez, "Invalid Date" YAZDIRMAZ). */
function _goreliZaman(isoZaman) {
  if (!isoZaman) return null;
  const t = new Date(isoZaman);
  if (isNaN(t.getTime())) return null;
  const farkSn = Math.max(0, (Date.now() - t.getTime()) / 1000);
  let goreli;
  if (farkSn < 60) goreli = 'az önce';
  else if (farkSn < 3600) goreli = `${Math.floor(farkSn / 60)} dakika önce`;
  else if (farkSn < 86400) goreli = `${Math.floor(farkSn / 3600)} saat önce`;
  else goreli = `${Math.floor(farkSn / 86400)} gün önce`;
  return { goreli, tamTarih: t.toLocaleString('tr-TR') };
}

function _apiHisseUyarla(x, favoriSet) {
  return {
    symbol: x.symbol,
    ad: x.ad || x.symbol,
    fiyat: x.fiyat || 0,
    degisim: x.degisim1ay || 0,
    degisim1hafta: x.degisim1hafta,
    degisim3ay: x.degisim3ay,
    degisim1yil: x.degisim1yil,
    puan: x.puan,
    karar: x.karar,
    hacim: x.hacim,
    spark: x.spark,
    trend: x.trend || 'Tut',
    favori: favoriSet.has(x.symbol),
  };
}

const FAVORI_ANAHTAR = 'pusula_favoriler';

/* Kullanıcı isteği: hisseye tıklayınca ANLIK fiyat da görülsün. Pusula
   statik bir sayfa olduğu için Yahoo Finance'e doğrudan istek atamıyoruz
   (CORS engelli) — bu yüzden küçük, ücretsiz bir aracı fonksiyon (Cloudflare
   Worker) kullanıyoruz; bkz. cloudflare_worker_canli_fiyat.js.
   BOŞ BIRAKILIRSA (henüz kurulmadıysa) özellik SESSİZCE devre dışı kalır —
   DetayEkran normal (son taramadan gelen) fiyatı göstermeye devam eder,
   hiçbir hata/kırık ekran çıkmaz. Worker kurulunca buraya adresi yapıştır:
   örn. 'https://pusula-canli-fiyat.KULLANICI-ADIN.workers.dev' */
const CANLI_FIYAT_API_URL = 'https://pusula-canli-fiyat.gkhnsmsk.workers.dev';
function _favorileriOku() {
  try {
    const ham = localStorage.getItem(FAVORI_ANAHTAR);
    return ham ? new Set(JSON.parse(ham)) : new Set(['PGSUS', 'ASTOR', 'THYAO']);
  } catch (e) { return new Set(['PGSUS', 'ASTOR', 'THYAO']); }
}
function _favorileriYaz(set) {
  try { localStorage.setItem(FAVORI_ANAHTAR, JSON.stringify([...set])); } catch (e) {}
}

/* ── Liste ekranlarında (Favoriler, Yükselecek Hisseler, Portföy) da anlık
   fiyat — kullanıcı isteği: "sadece tıklayınca değil, gösterilen hisselerin
   hepsinin anlık fiyatı sürekli yanıp sönmeli". Worker'ın toplu (?semboller=)
   modunu kullanır — TEK istekte onlarca sembolü birden çeker (Cloudflare
   ücretsiz katmanın istek başına 50 alt-istek sınırı yüzünden 45'te kesilir,
   bkz. cloudflare_worker_canli_fiyat.js). CANLI_FIYAT_API_URL boşsa (worker
   kurulmadıysa) hiçbir şey yapmaz — liste her zaman son taramadan gelen
   fiyatı göstermeye devam eder. */
const CANLI_LISTE_YENILEME_MS = 5000;
function useCanliFiyatlar(semboller) {
  const [canliMap, setCanliMap] = useState({});
  // semboller dizisi her render'da yeni referans olabilir (useMemo olmadan
  // çağrılırsa) — içerik aynıysa efekt yeniden kurulmasın diye JSON anahtarı
  // kullanılıyor.
  const anahtar = semboller.join(',');
  useEffect(() => {
    if (!CANLI_FIYAT_API_URL || semboller.length === 0) return;
    let iptal = false;
    function sorgula() {
      fetch(`${CANLI_FIYAT_API_URL}?semboller=${encodeURIComponent(semboller.join(','))}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(d => {
          if (iptal || !d || !d.fiyatlar) return;
          setCanliMap(prev => {
            const sonraki = { ...prev };
            for (const [sembol, veri] of Object.entries(d.fiyatlar)) {
              if (veri && veri.fiyat != null) sonraki[sembol] = veri;
            }
            return sonraki;
          });
        })
        .catch(() => {}); // sessizce yok say — statik fiyat gösterime devam eder
    }
    sorgula();
    const id = setInterval(sorgula, CANLI_LISTE_YENILEME_MS);
    return () => { iptal = true; clearInterval(id); };
  }, [anahtar]);
  return canliMap;
}

/* Bir satırdaki fiyat GERÇEKTEN değiştiğinde (aynı sayı tekrar gelirse
   tekrar tetiklenmez) kısa süreliğine 'yukari'/'asagi' döner — döviz.com
   tarzı yanıp sönen ticker efekti için. Her liste satırı bileşeni kendi
   değerini izler (useRef ile), bu yüzden her satır bağımsız yanıp söner. */
function useFlashOnChange(deger) {
  const [yon, setYon] = useState(null);
  const oncekiRef = useRef(deger);
  useEffect(() => {
    if (deger == null) return;
    if (oncekiRef.current != null && deger !== oncekiRef.current) {
      setYon(deger > oncekiRef.current ? 'yukari' : 'asagi');
      const t = setTimeout(() => setYon(null), 900);
      oncekiRef.current = deger;
      return () => clearTimeout(t);
    }
    oncekiRef.current = deger;
  }, [deger]);
  return yon;
}
function _flashSinifi(yon) {
  return yon === 'yukari' ? 'fiyat-flash-yukari' : yon === 'asagi' ? 'fiyat-flash-asagi' : '';
}

const TREND_STIL = {
  'Güçlü Al': 'bg-emerald-100 text-emerald-700 ring-1 ring-emerald-200',
  'Al':       'bg-green-100 text-green-700 ring-1 ring-green-200',
  'Tut':      'bg-amber-100 text-amber-700 ring-1 ring-amber-200',
  'Sat':      'bg-red-100 text-red-700 ring-1 ring-red-200',
  'Güçlü Sat':'bg-red-200 text-red-800 ring-1 ring-red-300',
};

const TREND_FILTRELERI = ['Tümü', 'Güçlü Al', 'Al', 'Tut', 'Sat', 'Güçlü Sat'];

function DegisimEtiketi({ deger }) {
  const pozitif = deger >= 0;
  return (
    <span className={"font-semibold tabular-nums " + (pozitif ? "text-emerald-600" : "text-red-600")}>
      {pozitif ? "+" : ""}{deger.toFixed(1)}%
    </span>
  );
}

/* Detay ekranındaki "Anlık / 1 Hafta / 1 Ay / 3 Ay / 1 Yıl" değişim
   çipleri — kullanıcı isteği: "tıklayınca anlık, haftalık, aylık, yıllık
   fiyat değişimini görebilmeliyim". */
function DegisimCipi({ etiket, deger }) {
  const pozitif = deger >= 0;
  return (
    <div className="shrink-0 bg-white rounded-xl shadow-sm ring-1 ring-gray-100 px-2.5 py-1.5 text-center min-w-[64px]">
      <div className="text-[10px] text-gray-400 uppercase tracking-wide">{etiket}</div>
      <div className={"text-sm font-bold tabular-nums " + (pozitif ? "text-emerald-600" : "text-red-600")}>
        {pozitif ? "+" : ""}{deger.toFixed(1)}%
      </div>
    </div>
  );
}

function TrendRozeti({ trend, buyuk }) {
  const boyut = buyuk ? "text-sm px-3 py-1.5" : "text-xs px-2.5 py-1";
  return (
    <span className={"inline-block rounded-full font-semibold whitespace-nowrap " + boyut + " " + (TREND_STIL[trend] || "bg-gray-100 text-gray-600")}>
      {trend}
    </span>
  );
}

/* NAVİGASYON ÖGELERİ — hem alt (mobil) hem yan (masaüstü) menü aynı listeyi
   kullanır, tek kaynak (iki ayrı yerde elle senkron tutmaya gerek kalmaz). */
const NAV_OGELERI = [
  { key: 'ana', ikon: '🏠', etiket: 'Ana' },
  { key: 'tarama', ikon: '🔎', etiket: 'Tarama' },
  { key: 'yukselecek', ikon: '📈', etiket: 'Yükselecek' },
  { key: 'portfoy', ikon: '💼', etiket: 'Portföy' },
  { key: 'ara', ikon: '🔍', etiket: 'Ara' },
];

/* ── Alt navigasyon — SADECE MOBİLDE (md ve üstünde gizli, yerini sol
   sabit menü alır). Detay ekranı açıkken o da gizlenir. ─────────────── */
function AltNav({ aktif, setAktif }) {
  return (
    <nav className="md:hidden fixed inset-x-0 bottom-0 z-40 bg-white/95 backdrop-blur border-t border-gray-200 safe-bottom">
      <div className="max-w-md mx-auto grid grid-cols-5">
        {NAV_OGELERI.map(o => (
          <button
            key={o.key}
            onClick={() => setAktif(o.key)}
            className={"flex flex-col items-center justify-center gap-0.5 py-2 min-h-[56px] active:bg-gray-100 transition-colors " +
                       (aktif === o.key ? "text-indigo-600" : "text-gray-400")}
          >
            <span className="text-xl leading-none">{o.ikon}</span>
            <span className="text-[11px] font-medium leading-none">{o.etiket}</span>
          </button>
        ))}
      </div>
    </nav>
  );
}

/* ── Yan navigasyon — SADECE MASAÜSTÜNDE (md ve üstü). PC'de de aynı
   akıcı SPA davranışı istendiği için mobildeki bottom-nav'ın birebir
   masaüstü karşılığı: sabit, her zaman görünür, Python'a gitmeden
   anında sekme değiştirir. Detay ekranı açıkken de görünür kalır —
   masaüstünde detay bir MODAL olarak açılır (bkz. DetayEkran), o yüzden
   arkadaki menüyü gizlemeye gerek yok. ───────────────────────────────── */
function YanNav({ aktif, setAktif }) {
  return (
    <nav className="hidden md:flex md:flex-col md:fixed md:inset-y-0 md:left-0 md:w-56 md:border-r md:border-gray-200 md:bg-white md:z-40">
      <div className="px-5 pt-6 pb-4">
        <div className="text-xl font-bold text-gray-900">🧭 Pusula</div>
        <div className="text-xs text-gray-400 mt-0.5">BIST mobil &amp; masaüstü</div>
      </div>
      <div className="flex flex-col gap-1 px-3">
        {NAV_OGELERI.map(o => (
          <button
            key={o.key}
            onClick={() => setAktif(o.key)}
            className={"flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-colors text-left " +
                       (aktif === o.key ? "bg-indigo-50 text-indigo-700" : "text-gray-500 hover:bg-gray-50")}
          >
            <span className="text-lg leading-none">{o.ikon}</span>
            {o.etiket}
          </button>
        ))}
      </div>
    </nav>
  );
}

/* ── Favoriler — yatay kayan chip kartlar (13 kart alt alta YIĞILMAZ) ── */
function FavoriKart({ h, onSec }) {
  const flashYon = useFlashOnChange(h.fiyat);
  return (
    <button
      onClick={() => onSec(h.symbol)}
      className="snap-start shrink-0 w-[128px] bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3 text-left active:scale-[.97] transition-transform min-h-[44px]"
    >
      <div className="font-bold text-gray-900">{h.symbol}</div>
      <div className={"text-sm text-gray-500 mt-0.5 tabular-nums transition-colors " + _flashSinifi(flashYon)}>{h.fiyat.toFixed(2)} ₺</div>
      <div className="mt-1"><DegisimEtiketi deger={h.degisim} /></div>
      <div className="mt-2"><TrendRozeti trend={h.trend} /></div>
    </button>
  );
}

function FavorilerSeridi({ hisseler, onSec }) {
  const favoriler = hisseler.filter(h => h.favori);
  if (favoriler.length === 0) {
    return <p className="text-sm text-gray-400 px-4">Henüz favori eklenmedi — bir hissenin ⭐ ikonuna dokunun.</p>;
  }
  return (
    <div className="flex gap-3 overflow-x-auto no-scrollbar px-4 pb-1 -mx-0 snap-x snap-mandatory">
      {favoriler.map(h => <FavoriKart key={h.symbol} h={h} onSec={onSec} />)}
    </div>
  );
}

/* ── Piyasa özeti — dikey liste satırı (tek dikey kaydırma) ──────────── */
function HisseSatiri({ h, onSec, onYildiz }) {
  // NEDEN <div role="button"> (gerçek <button> DEĞİL): yıldız da bir
  // <button>; HTML'de <button> içine <button> KONULAMAZ (jsdom testinde
  // "cannot appear as a descendant" uyarısıyla yakalandı — geçersiz iç içe
  // buton gerçek tarayıcılarda dokunma davranışını tutarsız yapabilirdi).
  const flashYon = useFlashOnChange(h.fiyat);
  return (
    <div
      role="button"
      tabIndex={0}
      onClick={() => onSec(h.symbol)}
      onKeyDown={(e) => { if (e.key === 'Enter') onSec(h.symbol); }}
      className="w-full flex items-center gap-3 bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 px-4 py-3 min-h-[44px] active:bg-gray-50 transition-colors text-left cursor-pointer"
    >
      <button
        onClick={(e) => { e.stopPropagation(); onYildiz(h.symbol); }}
        className="text-xl w-11 h-11 -ml-1 flex items-center justify-center shrink-0"
        aria-label="Favori"
      >
        {h.favori ? '⭐' : '☆'}
      </button>
      <div className="flex-1 min-w-0">
        <div className="font-bold text-gray-900">{h.symbol}</div>
        <div className="text-xs text-gray-400 truncate">{h.ad}</div>
      </div>
      <div className="text-right shrink-0">
        <div className={"font-semibold text-gray-900 tabular-nums transition-colors " + _flashSinifi(flashYon)}>{h.fiyat.toFixed(2)} ₺</div>
        <DegisimEtiketi deger={h.degisim} />
      </div>
      <TrendRozeti trend={h.trend} />
    </div>
  );
}

/* ── Ekran 1: Ana ─────────────────────────────────────────────────────── */
/* ── Sistem Durumu — küçük, katlanabilir bilgi kartı. Ağ isteği yapmaz,
   sadece pusula_veri_uret.sistem_durumu_uret()'in ürettiği zaten-hazır
   zaman damgalarını gösterir. Orijinal app.py'deki "ℹ️ Durum" sekmesinin
   hafifletilmiş karşılığı. ─────────────────────────────────────────────── */
function SistemDurumuKarti({ durum }) {
  const [acik, setAcik] = useState(false);
  if (!durum) return null;
  return (
    <div className="px-4 mt-2">
      <button
        onClick={() => setAcik(a => !a)}
        className="w-full flex items-center justify-between text-xs text-gray-400 px-1 py-1"
      >
        <span>ℹ️ Sistem Durumu {durum.tarama?.zaman ? "· son tarama " + new Date(durum.tarama.zaman).toLocaleString('tr-TR') : ""}</span>
        <span>{acik ? '▲' : '▼'}</span>
      </button>
      {acik && (
        <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3 mt-1 flex flex-col gap-1.5 text-xs pop-anim">
          {durum.tarama && (
            <div className="flex justify-between"><span className="text-gray-400">Son tarama</span>
              <span className="font-medium text-gray-700">{new Date(durum.tarama.zaman).toLocaleString('tr-TR')} · {durum.tarama.kapsam}</span></div>
          )}
          {durum.sanalPortfoy && (
            <div className="flex justify-between"><span className="text-gray-400">Sanal portföy</span>
              <span className="font-medium text-gray-700">
                {durum.sanalPortfoy.aktif ? "aktif" : "pasif"} · {durum.sanalPortfoy.pozisyonSayisi} pozisyon
                {durum.sanalPortfoy.sonRebalansTarihi ? " · rebalans " + durum.sanalPortfoy.sonRebalansTarihi : ""}
              </span></div>
          )}
          {durum.tavsiyeSayisi != null && (

/* Fon & Kurumsal — TEFAS'ın yerli yatırım fonlarındaki ortalama hisse
   ağırlığı (aylık, makro seviyeli). Artıyorsa yerli fonlar borsaya para
   sokuyor demektir. Bkz. veri_katmani.tefas_hisse_trendi + pusula_veri_uret.py. */
function FonKurumsalEkran({ fonKurumsal }) {
  const trend = fonKurumsal?.tefasTrend || [];
  if (trend.length < 2) {
    return (
      <div className="px-4">
        <p className="text-sm text-gray-400 py-8 text-center">
          TEFAS fon verisi henüz üretilmedi ya da geçici olarak erişilemiyor.
          Bir sonraki otomatik taramada tekrar denenecek.
        </p>
      </div>
    );
  }
  const genislik = 320, yukseklik = 110, dolgu = 8;
  const degerler = trend.map(t => t.deger);
  const minD = Math.min(...degerler), maxD = Math.max(...degerler);
  const aralik = (maxD - minD) || 1;
  const yol = trend.map((t, i) => {
    const x = dolgu + (i / (trend.length - 1)) * (genislik - 2 * dolgu);
    const y = yukseklik - dolgu - ((t.deger - minD) / aralik) * (yukseklik - 2 * dolgu);
    return `${x},${y}`;
  }).join(' ');
  const ilk = trend[0].deger, son = trend[trend.length - 1].deger;
  const artis = son >= ilk;
  return (
    <div className="px-4">
      <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-4">
        <div className="text-xs text-gray-400 uppercase tracking-wide">Yerli Fonlarda Ortalama Hisse Ağırlığı</div>
        <div className={"text-2xl font-bold tabular-nums mt-1 " + (artis ? "text-emerald-600" : "text-red-600")}>
          %{son.toFixed(1)}
        </div>
        <svg viewBox={`0 0 ${genislik} ${yukseklik}`} className="w-full h-28 mt-2">
          <polyline points={yol} fill="none" stroke={artis ? "#059669" : "#dc2626"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
        <p className="text-xs text-gray-400 mt-2 leading-relaxed">
          {artis
            ? "Son aylarda yerli fonlar borsaya PARA SOKUYOR — hisse ağırlığı artıyor."
            : "Son aylarda yerli fonlar borsadan PARA ÇEKİYOR — hisse ağırlığı azalıyor."}
          {" "}(TEFAS, aylık örneklem)
        </p>
      </div>
    </div>
  );
}

/* ── Ekran 3: Ara ─────────────────────────────────────────────────────── */
/* Kod bilmeden de bulunsun diye: harfe göre gözat + en çok işlem görenler.
   Kullanıcı "sadece kısa kod olmasın" dedi — arama kutusu hâlâ kod/ad
   yazmayı destekler ama artık BOŞKEN de bir şeyler gösterir, ayrıca A-Z
   harf şeridiyle tıklayarak da gözatılabilir. */
function AraEkran({ hisseler, onSec, onYildiz }) {
  const [metin, setMetin] = useState('');
  const [harf, setHarf] = useState(null);

  const harfler = useMemo(() => {
    const s = new Set();
    hisseler.forEach(h => { if (h.symbol) s.add(h.symbol[0].toUpperCase()); });
    return Array.from(s).sort();
  }, [hisseler]);

  const enCokIslemGoren = useMemo(() => {
    return [...hisseler].sort((a, b) => (b.hacim || 0) - (a.hacim || 0)).slice(0, 20);
  }, [hisseler]);

  const sonuclar = useMemo(() => {
    const q = metin.trim().toLowerCase();
    if (q) {
      return hisseler.filter(h => h.symbol.toLowerCase().includes(q) || h.ad.toLowerCase().includes(q));
    }
    if (harf) {
      return hisseler.filter(h => h.symbol.toUpperCase().startsWith(harf))
        .sort((a, b) => a.symbol.localeCompare(b.symbol));
    }
    return enCokIslemGoren;
  }, [hisseler, metin, harf, enCokIslemGoren]);

  const bosDurum = !metin && !harf;

  return (
    <div className="pb-4">
      <div className="px-4 pt-2 pb-3">
        <h1 className="text-2xl font-bold text-gray-900">Ara</h1>
        <p className="text-sm text-gray-400">Kod ya da şirket adı yazın, ya da harfe/listeye göz atın — kodu bilmenize gerek yok</p>
      </div>
      <div className="px-4">
        <input
          value={metin}
          onChange={e => { setMetin(e.target.value); if (e.target.value) setHarf(null); }}
          placeholder="Hisse ara… (ör. thy, garanti)"
          className="w-full min-h-[44px] rounded-2xl bg-white ring-1 ring-gray-200 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />
      </div>
      {!metin && (
        <div className="px-4 mt-3 flex flex-wrap gap-1.5">
          <button
            onClick={() => setHarf(null)}
            className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${!harf ? 'bg-indigo-600 text-white' : 'bg-white ring-1 ring-gray-200 text-gray-500'}`}
          >
            En çok işlem gören
          </button>
          {harfler.map(hf => (
            <button
              key={hf}
              onClick={() => setHarf(hf)}
              className={`w-7 h-7 rounded-lg text-xs font-semibold ${harf === hf ? 'bg-indigo-600 text-white' : 'bg-white ring-1 ring-gray-200 text-gray-500'}`}
            >
              {hf}
            </button>
          ))}
        </div>
      )}
      <div className="px-4 flex flex-col gap-2 md:grid md:grid-cols-2 md:gap-3 mt-3">
        {bosDurum && (
          <p className="text-xs text-gray-400 col-span-2 -mb-1">📈 En çok işlem gören 20 hisse (aşağıdan da bir harf seçebilirsiniz)</p>
        )}
        {metin && sonuclar.length === 0 && (
          <p className="text-sm text-gray-400 py-6 text-center col-span-2">"{metin}" için sonuç yok.</p>
        )}
        {harf && sonuclar.length === 0 && (
          <p className="text-sm text-gray-400 py-6 text-center col-span-2">"{harf}" ile başlayan hisse yok.</p>
        )}
        {sonuclar.map(h => <HisseSatiri key={h.symbol} h={h} onSec={onSec} onYildiz={onYildiz} />)}
      </div>
    </div>
  );
}

/* ── Ekran 4: Portföy — GERÇEK sanal portföy verisi (sanal_portfoy.json)
   Kaynak: gunluk_sanal_yatirim.py her çalıştığında (haftalık rebalans +
   günlük stop kontrolü) pozisyonları günceller, pusula_veri_uret.py da
   sonucu buraya taşır. 'nakit' ve 'baslangicButce' gerçek portföy
   durumundan gelir; elle ekle/çıkar bu üstüne DENEME amaçlı yapılır (sadece
   tarayıcıda kalır, gerçek portföyü etkilemez). ───────────────────────── */
/* ── Basit SVG eşit-eğri grafiği — kütüphane yok, tek polyline. Portföy
   değerini endeksle (XU100) karşılaştırıyor: dürüst performans bakışı. ── */
function EsitEgrisi({ veri }) {
  if (!veri || veri.length < 2) {
    return <p className="text-xs text-gray-400 py-6 text-center">Yeterli geçmiş veri birikmedi.</p>;
  }
  const genislik = 320, yukseklik = 100, dolgu = 6;
  const degerler = veri.map(v => v.deger);
  const endeksler = veri.filter(v => v.endeks != null).map(v => v.endeks);
  const minD = Math.min(...degerler), maxD = Math.max(...degerler);
  const aralikD = (maxD - minD) || 1;
  const nokta = (i, deger) => {
    const x = dolgu + (i / (veri.length - 1)) * (genislik - 2 * dolgu);
    const y = yukseklik - dolgu - ((deger - minD) / aralikD) * (yukseklik - 2 * dolgu);
    return [x, y];
  };
  const portfoyYolu = veri.map((v, i) => nokta(i, v.deger).join(',')).join(' ');
  let endeksYolu = null;
  if (endeksler.length === veri.length) {
    const minE = Math.min(...endeksler), maxE = Math.max(...endeksler);
    const aralikE = (maxE - minE) || 1;
    endeksYolu = veri.map((v, i) => {
      const x = dolgu + (i / (veri.length - 1)) * (genislik - 2 * dolgu);
      const y = yukseklik - dolgu - ((v.endeks - minE) / aralikE) * (yukseklik - 2 * dolgu);
      return `${x},${y}`;
    }).join(' ');
  }
  return (
    <svg viewBox={`0 0 ${genislik} ${yukseklik}`} className="w-full h-28">
      {endeksYolu && <polyline points={endeksYolu} fill="none" stroke="#cbd5e1" strokeWidth="2" strokeDasharray="4,3" />}
      <polyline points={portfoyYolu} fill="none" stroke="#4f46e5" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

/* ── Backtest / Doğrulama — elle çalıştırılan BACKTEST_CALISTIR.bat'ın
   sonucu (backtest_sonuc.txt). Günlük otomasyona DAHİL DEĞİL (TÜM BIST × 5

function BacktestEkran({ backtest }) {

function PozisyonSatiri({ p }) {

function PortfoyEkran({ hisseler, portfoy, setPortfoy, gercekPortfoy, performans, backtest }) {
  const [altSekme, setAltSekme] = useState('pozisyonlar');
  const [formAcik, setFormAcik] = useState(false);
  const [ySembol, setYSembol] = useState(hisseler[0]?.symbol || '');
  const [yAdet, setYAdet] = useState('');
  const [yMaliyet, setYMaliyet] = useState('');

  const satirlar = useMemo(() => portfoy.map(p => {
    const h = hisseler.find(x => x.symbol === p.symbol);
    const guncelFiyat = h ? h.fiyat : (p.sonFiyat || p.maliyet);
    const deger = guncelFiyat * p.adet;
    const maliyetToplam = p.maliyet * p.adet;
    const karZarar = deger - maliyetToplam;
    const karZararYuzde = maliyetToplam ? (karZarar / maliyetToplam) * 100 : 0;
    return { ...p, ad: h?.ad || p.ad || p.symbol, guncelFiyat, deger, karZarar, karZararYuzde };
  }), [portfoy, hisseler]);

  const toplamPozisyonDegeri = satirlar.reduce((s, x) => s + x.deger, 0);
  const nakit = gercekPortfoy?.nakit ?? 0;
  const toplamDeger = toplamPozisyonDegeri + nakit;
  const toplamKarZarar = satirlar.reduce((s, x) => s + x.karZarar, 0);
  const baslangicButce = gercekPortfoy?.baslangicButce || 0;
  const genelGetiriYuzde = baslangicButce ? ((toplamDeger - baslangicButce) / baslangicButce) * 100 : null;

  function ekle() {
    const adet = parseFloat(yAdet);
    const maliyet = parseFloat(yMaliyet);
    if (!ySembol || !adet || !maliyet || adet <= 0 || maliyet <= 0) return;
    setPortfoy(prev => [...prev.filter(p => p.symbol !== ySembol), { symbol: ySembol, adet, maliyet }]);
    setYAdet(''); setYMaliyet(''); setFormAcik(false);
  }

  return (
    <div className="pb-4">
      <div className="px-4 pt-2 pb-3">
        <h1 className="text-2xl font-bold text-gray-900">Sanal Portföy</h1>
        <p className="text-sm text-gray-400">{satirlar.length} pozisyon · ⚠️ sanal, gerçek para kullanılmıyor</p>
      </div>

      <div className="flex gap-2 px-4 pb-3">
        <button
          onClick={() => setAltSekme('pozisyonlar')}
          className={"flex-1 min-h-[40px] rounded-xl text-xs sm:text-sm font-semibold transition-colors " +
                     (altSekme === 'pozisyonlar' ? "bg-indigo-600 text-white" : "bg-white text-gray-600 ring-1 ring-gray-200")}
        >
          💼 Pozisyonlar
        </button>
        <button
          onClick={() => setAltSekme('performans')}
          className={"flex-1 min-h-[40px] rounded-xl text-xs sm:text-sm font-semibold transition-colors " +
                     (altSekme === 'performans' ? "bg-indigo-600 text-white" : "bg-white text-gray-600 ring-1 ring-gray-200")}
        >
          📊 Performans
        </button>
        <button
          onClick={() => setAltSekme('backtest')}
          className={"flex-1 min-h-[40px] rounded-xl text-xs sm:text-sm font-semibold transition-colors " +
                     (altSekme === 'backtest' ? "bg-indigo-600 text-white" : "bg-white text-gray-600 ring-1 ring-gray-200")}
        >
          🧪 Backtest
        </button>
      </div>

      {altSekme === 'performans' ? (
        <div className="px-4">
          <PerformansEkran performans={performans} />
        </div>
      ) : altSekme === 'backtest' ? (
        <div className="px-4">
          <BacktestEkran backtest={backtest} />
        </div>
      ) : (
      <>
      <div className="px-4">
        <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-4">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-xs text-gray-400 uppercase tracking-wide">Toplam Değer</div>
              <div className="text-xl font-bold text-gray-900 tabular-nums">{toplamDeger.toLocaleString('tr-TR', {maximumFractionDigits: 2})} ₺</div>
              {genelGetiriYuzde !== null && (
                <div className={"text-xs font-semibold tabular-nums " + (genelGetiriYuzde >= 0 ? "text-emerald-600" : "text-red-600")}>
                  başlangıca göre {genelGetiriYuzde >= 0 ? "+" : ""}{genelGetiriYuzde.toFixed(1)}%
                </div>
              )}
            </div>
            <div className="text-right">
              <div className="text-xs text-gray-400 uppercase tracking-wide">Pozisyon K/Z</div>
              <div className={"text-xl font-bold tabular-nums " + (toplamKarZarar >= 0 ? "text-emerald-600" : "text-red-600")}>
                {toplamKarZarar >= 0 ? "+" : ""}{toplamKarZarar.toLocaleString('tr-TR', {maximumFractionDigits: 2})} ₺
              </div>
            </div>
          </div>
          <div className="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between text-sm">
            <span className="text-gray-400">Nakit</span>
            <span className="font-semibold text-gray-700 tabular-nums">{nakit.toLocaleString('tr-TR', {maximumFractionDigits: 2})} ₺</span>
          </div>
        </div>
      </div>

      <div className="px-4 flex flex-col gap-2 mt-4">
        {satirlar.map(p => <PozisyonSatiri key={p.symbol} p={p} />)}
      </div>

      <div className="px-4 mt-4">
        {!formAcik ? (
          <button
            onClick={() => setFormAcik(true)}
            className="w-full min-h-[44px] rounded-2xl bg-indigo-600 text-white font-semibold active:bg-indigo-700 transition-colors"
          >
            + Ekle
          </button>
        ) : (
          <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-4 flex flex-col gap-3 pop-anim">
            <select
              value={ySembol}
              onChange={e => setYSembol(e.target.value)}
              className="w-full min-h-[44px] rounded-xl bg-gray-50 ring-1 ring-gray-200 px-3"
            >
              {hisseler.map(h => <option key={h.symbol} value={h.symbol}>{h.symbol} — {h.ad}</option>)}
            </select>
            <div className="flex gap-2">
              <input type="number" inputMode="decimal" placeholder="Adet" value={yAdet}
                     onChange={e => setYAdet(e.target.value)}
                     className="w-1/2 min-h-[44px] rounded-xl bg-gray-50 ring-1 ring-gray-200 px-3" />
              <input type="number" inputMode="decimal" placeholder="Maliyet (₺)" value={yMaliyet}
                     onChange={e => setYMaliyet(e.target.value)}
                     className="w-1/2 min-h-[44px] rounded-xl bg-gray-50 ring-1 ring-gray-200 px-3" />
            </div>
            <div className="flex gap-2">
              <button onClick={() => setFormAcik(false)} className="flex-1 min-h-[44px] rounded-xl bg-gray-100 text-gray-600 font-semibold">İptal</button>
              <button onClick={ekle} className="flex-1 min-h-[44px] rounded-xl bg-indigo-600 text-white font-semibold active:bg-indigo-700">Ekle</button>
            </div>
          </div>
        )}
      </div>
      </>
      )}
    </div>
  );
}

/* ── Hisse detay — TAM EKRAN overlay, alttan kayarak açılır ("push")
   NEDEN bottom nav'ı gizliyoruz: gerçek native app'lerde detay ekranı
   önceki ekranın ÜSTÜNE gelir (push navigation); alt sekmeler kaybolur,
   sadece "‹ Geri" ile dönülür. Bu Streamlit'te YAPILAMAYAN bir şeydi. ─── */
/* Son ~15 kapanış fiyatından tek çizgi grafik — hisse.spark zaten
   tarama_onbellek.json:"Trend" sütunundan geliyordu, önceden hiç
   çizilmiyordu (sadece taşınıyordu). Kütüphane gerekmez, tek polyline. */
function SparkGrafik({ veri }) {
  if (!veri || veri.length < 2) return null;
  const genislik = 320, yukseklik = 70, dolgu = 4;
  const minV = Math.min(...veri), maxV = Math.max(...veri);
  const aralik = (maxV - minV) || 1;
  const artis = veri[veri.length - 1] >= veri[0];
  const yol = veri.map((v, i) => {
    const x = dolgu + (i / (veri.length - 1)) * (genislik - 2 * dolgu);
    const y = yukseklik - dolgu - ((v - minV) / aralik) * (yukseklik - 2 * dolgu);
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${genislik} ${yukseklik}`} className="w-full h-16 mt-3">
      <polyline points={yol} fill="none" stroke={artis ? "#059669" : "#dc2626"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function DetayEkran({ hisse, onGeri, onYildiz, onPortfoyeEkle, zamanHam, akdVerisi }) {
  const [eklendiGoster, setEklendiGoster] = useState(false);
  // Panel açık kaldıkça "X dakika önce" bayatlamasın diye 60 sn'de bir
  // yeniden hesaplat (sadece bir sayaç — gerçek veriyi yeniden çekmiyor).
  const [, setTik] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTik(t => t + 1), 60000);
    return () => clearInterval(id);
  }, []);
  // Anlık fiyat — CANLI_FIYAT_API_URL doluysa (aracı fonksiyon kurulduysa)
  // panel AÇIK KALDIKÇA her birkaç saniyede bir sorar (döviz.com tarzı
  // "yanıp sönen" ticker hissi için — kullanıcı isteği). Kurulmadıysa ya da
  // istek başarısız olursa (worker henüz yok, ağ hatası, hafta sonu vb.)
  // SESSİZCE hiçbir şey göstermez — sayfa asla kırılmaz, her zaman son
  // taramadan gelen fiyat görünür durumda kalır.
  const [canliFiyat, setCanliFiyat] = useState(null);
  // flashYonu: 'yukari' | 'asagi' | null — sadece fiyat GERÇEKTEN değişince
  // (aynı sayı tekrar gelirse flash TEKRARLANMAZ) kısa bir animasyon tetikler.
  const [flashYonu, setFlashYonu] = useState(null);
  const oncekiFiyatRef = useRef(null);
  useEffect(() => {
    setCanliFiyat(null);
    setFlashYonu(null);
    oncekiFiyatRef.current = null;
    if (!CANLI_FIYAT_API_URL || !hisse) return;
    let iptal = false;

    function sorgula() {
      fetch(`${CANLI_FIYAT_API_URL}?sembol=${encodeURIComponent(hisse.symbol)}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(d => {
          if (iptal || !d || d.fiyat == null) return;
          const onceki = oncekiFiyatRef.current;
          if (onceki != null && d.fiyat !== onceki) {
            const yon = d.fiyat > onceki ? 'yukari' : 'asagi';
            setFlashYonu(yon);
            setTimeout(() => { if (!iptal) setFlashYonu(null); }, 900);
          }
          oncekiFiyatRef.current = d.fiyat;
          setCanliFiyat(d);
        })
        .catch(() => {}); // sessizce yok say — mevcut fiyat gösterime devam eder
    }

    sorgula(); // ilk sorgu hemen
    const id = setInterval(sorgula, CANLI_FIYAT_YENILEME_MS);
    return () => { iptal = true; clearInterval(id); };
  }, [hisse && hisse.symbol]);

  if (!hisse) return null;
  const taze = _goreliZaman(zamanHam);
  const canliTaze = canliFiyat ? _goreliZaman(canliFiyat.zaman) : null;
  // AKD sadece favorilerde toplandığı için (bkz. akd_veri_toplama.py) çoğu
  // hissede bulunmayabilir — o zaman kart hiç gösterilmez.
  const akd = (akdVerisi || []).find(a => a.symbol === hisse.symbol);
  const akdTaze = akd ? _goreliZaman(akd.zaman) : null;

  function portfoyeEkleTikla() {
    onPortfoyeEkle(hisse.symbol);
    setEklendiGoster(true);
    setTimeout(() => setEklendiGoster(false), 1600);
  }

  // NEDEN İKİ KATMANLI SARMALAYICI: mobilde tam ekran ("push" — bkz. yukarı),
  // masaüstünde ORTALANMIŞ bir MODAL kartı (arkada karartılmış arka plan,
  // dışına tıklayınca kapanır). Aynı bileşen, tek CSS ile iki farklı "native"
  // his veriyor — PC'de de aynı akıcı SPA davranışı isteniyordu.
  return (
    <div
      className="fixed inset-0 z-50 detay-anim md:bg-black/40 md:flex md:items-center md:justify-center md:p-6"
      onClick={(e) => { if (e.target === e.currentTarget) onGeri(); }}
    >
      <div className="h-full md:h-auto md:max-h-[85vh] md:w-full md:max-w-xl bg-gray-50 flex flex-col md:rounded-3xl md:shadow-2xl md:overflow-hidden">
        <div className="safe-top bg-white border-b border-gray-100 px-2 py-2 flex items-center gap-2 shrink-0">
          <button onClick={onGeri} className="min-h-[44px] min-w-[44px] flex items-center justify-center text-2xl text-gray-700 active:bg-gray-100 rounded-xl">
            ‹
          </button>
          <div className="font-bold text-gray-900 flex-1">{hisse.symbol}</div>
          <button onClick={() => onYildiz(hisse.symbol)} className="min-h-[44px] min-w-[44px] flex items-center justify-center text-2xl">
            {hisse.favori ? '⭐' : '☆'}
          </button>
        </div>

        <div className="flex-1 overflow-y-auto px-4 py-5">
          <div className="text-sm text-gray-400">{hisse.ad}</div>
          <div
            className={
              "mt-1 inline-block px-1.5 -mx-1.5 text-4xl font-bold text-gray-900 tabular-nums transition-colors " +
              (flashYonu === 'yukari' ? 'fiyat-flash-yukari' : flashYonu === 'asagi' ? 'fiyat-flash-asagi' : '')
            }
          >
            {(canliFiyat ? canliFiyat.fiyat : hisse.fiyat).toFixed(2)} ₺
          </div>
          {/* Anlık fiyat bulunduysa rozet göster (aracı fonksiyon kuruluysa) —
              yeşil nokta CANLI_FIYAT_YENILEME_MS aralığında nabız gibi atar,
              kullanıcı verinin gerçekten periyodik yenilendiğini görsün. */}
          {canliFiyat && (
            <div className="mt-0.5 inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-full px-2 py-0.5">
              <span className="relative flex h-2 w-2">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              Anlık{canliTaze ? ` · ${canliTaze.goreli}` : ''}
            </div>
          )}
          <div className="mt-2 flex items-center gap-2">
            <DegisimEtiketi deger={hisse.degisim} />
            <span className="text-gray-300">·</span>
            <TrendRozeti trend={hisse.trend} buyuk />
          </div>
          {/* Veri tazeliği (son tarama) — kullanıcı isteği: "kaç dk önce" +
              tam tarih/saat. taze === null ise (henüz yüklenmediyse/parse
              edilemediyse) HİÇBİR ŞEY gösterme; yanlış/sahte bir tazelik
              iddiası vermemek için. */}
          {taze && (
            <div className="mt-1.5 text-xs text-gray-400">
              🕒 Tarama verisi {taze.goreli} güncellendi · {taze.tamTarih}
            </div>
          )}

          {/* Kullanıcı isteği: "tıklayınca anlık, haftalık, aylık, yıllık
              fiyat değişimini görebilmeliyim". Anlık = worker'dan gelen son
              fiyat vs. bir önceki kapanış (canliFiyat kurulduysa); diğerleri
              tarama verisindeki kapanış fiyatlarından (analiz_motoru.py). Bir
              dönem için veri yoksa (ör. hisse 1 yıldır işlem görmüyorsa) o
              çip hiç gösterilmez. */}
          {(canliFiyat || hisse.degisim1hafta != null || hisse.degisim != null ||
            hisse.degisim3ay != null || hisse.degisim1yil != null) && (
            <div className="mt-3 flex items-center gap-2 overflow-x-auto no-scrollbar">
              {canliFiyat && canliFiyat.oncekiKapanis && (
                <DegisimCipi etiket="Anlık" deger={100 * (canliFiyat.fiyat / canliFiyat.oncekiKapanis - 1)} />
              )}
              {hisse.degisim1hafta != null && <DegisimCipi etiket="1 Hafta" deger={hisse.degisim1hafta} />}
              {hisse.degisim != null && <DegisimCipi etiket="1 Ay" deger={hisse.degisim} />}
              {hisse.degisim3ay != null && <DegisimCipi etiket="3 Ay" deger={hisse.degisim3ay} />}
              {hisse.degisim1yil != null && <DegisimCipi etiket="1 Yıl" deger={hisse.degisim1yil} />}
            </div>
          )}

          <SparkGrafik veri={hisse.spark} />

          <div className="mt-6 bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-4">
            <div className="text-xs text-gray-400 uppercase tracking-wide mb-2">Algoritma Kararı</div>
            <div className="flex items-center gap-3">
              <TrendRozeti trend={hisse.trend} buyuk />
              <span className="text-sm text-gray-500">
                {hisse.karar || (hisse.trend.includes('Al') ? 'Trend ve puanlama pozitif yönde.' :
                 hisse.trend === 'Tut' ? 'Belirgin bir sinyal yok, bekle-gör.' :
                 'Trend ve puanlama negatif yönde.')}
              </span>
            </div>
          </div>

          {/* AKD (aracı kurum dağılımı) sinyali — sadece favoriler için,
              Telegram'dan bulutta toplanır (bkz. akd_veri_toplama.py).
              Veri yoksa (henüz toplanmadı / favori değil) kart HİÇ görünmez —
              olmayan bir veriyi varmış gibi göstermemek için. */}
          {akd && (
            <div className="mt-3 bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-4">
              <div className="text-xs text-gray-400 uppercase tracking-wide mb-2">
                AKD Sinyali (Aracı Kurum Dağılımı)
              </div>
              {akd.okunabildiMi === false ? (
                <p className="text-sm text-gray-400">Veri çekildi ama tablo okunamadı.</p>
              ) : (
                <>
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-semibold text-gray-800">{akd.karar || '—'}</span>
                    {akd.puan != null && (
                      <span className="text-xs text-gray-400 tabular-nums">(puan {akd.puan > 0 ? '+' : ''}{akd.puan})</span>
                    )}
                  </div>
                  {(akd.sebepler || []).length > 0 && (
                    <ul className="mt-2 space-y-1">
                      {akd.sebepler.map((s, i) => (
                        <li key={i} className="text-xs text-gray-500">• {s}</li>
                      ))}
                    </ul>
                  )}
                </>
              )}
              {akdTaze && (
                <div className="mt-2 text-[11px] text-gray-400">
                  🕒 {akdTaze.goreli} · {akdTaze.tamTarih}
                </div>
              )}
            </div>
          )}

          {(hisse.puan != null || hisse.degisim3ay != null || hisse.hacim != null ||
            hisse.kisaPuan != null || hisse.donusGucu != null) && (
            <div className="mt-3 grid grid-cols-2 gap-3">
              {hisse.puan != null && (
                <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3">
                  <div className="text-[11px] text-gray-400 uppercase tracking-wide">Genel Puan</div>
                  <div className="text-lg font-bold text-indigo-600 tabular-nums">{hisse.puan.toFixed(0)}</div>
                </div>
              )}
              {hisse.kisaPuan != null && (
                <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3">
                  <div className="text-[11px] text-gray-400 uppercase tracking-wide">Kısa Vade Puan</div>
                  <div className="text-lg font-bold text-indigo-600 tabular-nums">{hisse.kisaPuan.toFixed(0)}</div>
                </div>
              )}
              {hisse.degisim3ay != null && (
                <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3">
                  <div className="text-[11px] text-gray-400 uppercase tracking-wide">3 Aylık Değişim</div>
                  <div className={"text-lg font-bold tabular-nums " + (hisse.degisim3ay >= 0 ? "text-emerald-600" : "text-red-600")}>
                    {hisse.degisim3ay >= 0 ? "+" : ""}{hisse.degisim3ay.toFixed(1)}%
                  </div>
                </div>
              )}
              {hisse.donusGucu != null && (
                <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3">
                  <div className="text-[11px] text-gray-400 uppercase tracking-wide">Dönüş Gücü</div>
                  <div className="text-lg font-bold text-emerald-600 tabular-nums">+{hisse.donusGucu.toFixed(0)}</div>
                </div>
              )}
              {hisse.hacim != null && (
                <div className="bg-white rounded-2xl shadow-sm ring-1 ring-gray-100 p-3 col-span-2">
                  <div className="text-[11px] text-gray-400 uppercase tracking-wide">Günlük Hacim</div>
                  <div className="text-lg font-bold text-gray-900 tabular-nums">{hisse.hacim.toLocaleString('tr-TR', {maximumFractionDigits: 1})} M₺</div>
                </div>
              )}
            </div>
          )}

          <p className="mt-6 text-xs text-gray-400 leading-relaxed">
            Fiyat ve trend, en son arka plan taramasından (analiz_motoru.py)
            gelir. Yüzde değişim şu an 1 aylık; günlük değişim önbellekte
            henüz tutulmuyor.
          </p>
        </div>

        <div className="shrink-0 px-4 pb-4 pt-2 safe-bottom relative">
          {eklendiGoster && (
            <div className="absolute -top-10 left-4 right-4 text-center text-sm font-semibold text-emerald-700 bg-emerald-50 ring-1 ring-emerald-200 rounded-xl py-2 fade-anim">
              ✓ Portföye eklendi
            </div>
          )}
          <button
            onClick={portfoyeEkleTikla}
            className="w-full min-h-[52px] rounded-2xl bg-indigo-600 text-white font-bold text-base active:bg-indigo-700 transition-colors"
          >
            Portföye Ekle
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Kök bileşen ──────────────────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState('ana');
  const [yukleniyor, setYukleniyor] = useState(true);
  const [hisseler, setHisseler] = useState(MOCK_HISSELER);
  const [yukselecek, setYukselecek] = useState([]);
  const [dipDonusu, setDipDonusu] = useState([]);
  const [taramaZaman, setTaramaZaman] = useState(null);
  const [taramaZamanHam, setTaramaZamanHam] = useState(null); // ISO — detay ekranında "X dk önce" için
  const [detaySembol, setDetaySembol] = useState(null);
  const [portfoy, setPortfoy] = useState([]);
  const [gercekPortfoy, setGercekPortfoy] = useState(null);
  const [performans, setPerformans] = useState(null);
  const [fonKurumsal, setFonKurumsal] = useState(null);
  const [sistemDurumu, setSistemDurumu] = useState(null);
  const [backtest, setBacktest] = useState(null);
  const [akdVerisi, setAkdVerisi] = useState(null);

  // Gerçek veriyi çek — docs/pusula/data/*.json (bkz. pusula_veri_uret.py).
  // Üçü de bağımsız başarısız olabilir (ör. henüz üretilmemişse); biri
  // başarısız olursa diğerleri yine de yüklenir, sayfa çökmez.
  useEffect(() => {
    const favSet = _favorileriOku();

    fetch('./data/tarama.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        setHisseler((d.hisseler || []).map(x => _apiHisseUyarla(x, favSet)));
        setTaramaZaman(d.zaman ? new Date(d.zaman).toLocaleString('tr-TR') : null);
        setTaramaZamanHam(d.zaman || null);
      })
      .catch(() => {}); // MOCK_HISSELER'de kalır

    fetch('./data/yukselecek.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setYukselecek(d.hisseler || []))
      .catch(() => {});

    fetch('./data/dip_donusu.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setDipDonusu(d.hisseler || []))
      .catch(() => {});

    fetch('./data/portfoy.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => {
        setGercekPortfoy(d);
        setPortfoy((d.pozisyonlar || []).map(p => ({
          symbol: p.symbol, ad: p.ad, adet: p.adet, maliyet: p.maliyet, sonFiyat: p.sonFiyat,
        })));
      })
      .catch(() => {})
      .finally(() => setYukleniyor(false));

    fetch('./data/performans.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setPerformans(d))
      .catch(() => {});

    fetch('./data/fon_kurumsal.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setFonKurumsal(d))
      .catch(() => {});

    fetch('./data/sistem_durumu.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setSistemDurumu(d))
      .catch(() => {});

    fetch('./data/backtest.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setBacktest(d))
      .catch(() => {});

    // AKD (aracı kurum dağılımı) — sadece favoriler için üretilir (Görev #53).
    // Dosya henüz yoksa (otomasyon hiç çalışmadıysa/secret eklenmediyse)
    // sessizce boş kalır, DetayEkran'da AKD kartı hiç görünmez.
    fetch('./data/akd.json').then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setAkdVerisi(d.hisseler || []))
      .catch(() => {});
  }, []);

  function yildizToggle(symbol) {
    setHisseler(prev => {
      const sonraki = prev.map(h => h.symbol === symbol ? { ...h, favori: !h.favori } : h);
      _favorileriYaz(new Set(sonraki.filter(h => h.favori).map(h => h.symbol)));
      return sonraki;
    });
  }

  function portfoyeEkle(symbol) {
    setPortfoy(prev => {
      if (prev.some(p => p.symbol === symbol)) return prev;
      const h = hisseler.find(x => x.symbol === symbol) || yukselecek.find(x => x.symbol === symbol);
      return [...prev, { symbol, adet: 10, maliyet: h ? h.fiyat : 0 }];
    });
  }

  // Detay ekranı "Ana/Tarama/Ara", "Yükselecek" veya "Dipten Dönenler"
  // listesindeki bir hisse için açılabilir — üç kaynağı birleştirip arıyoruz.
  function _digerListedenBul(symbol) {
    const y = yukselecek.find(h => h.symbol === symbol);
    if (y) return { ...y, degisim: y.degisim1ay, favori: hisseler.some(h => h.symbol === symbol && h.favori) };
    const d = dipDonusu.find(h => h.symbol === symbol);
    if (d) return { ...d, degisim: d.degisim1ay, favori: hisseler.some(h => h.symbol === symbol && h.favori) };
    return null;
  }
  const secilenHisse = detaySembol
    ? (hisseler.find(h => h.symbol === detaySembol) || _digerListedenBul(detaySembol))
    : null;

  // ── Liste ekranlarında da anlık/yanıp sönen fiyat (kullanıcı isteği) ──
  // "TÜM Piyasa Özeti" (~500+ hisse) canlı tutmak Yahoo/Cloudflare için
  // güvenli değil (bkz. cloudflare_worker_canli_fiyat.js'teki 45 sembol
  // sınırı notu) — bu yüzden sadece kullanıcının GERÇEKTEN takip ettiği,
  // sınırlı sayıdaki listeler canlı: Favoriler, Portföy pozisyonları,
  // Yükselebilecek Hisseler ve Dipten Dönenler (ikisi de zaten ≤40 aday).
  // Bu semboller için çekilen anlık fiyat, aynı hisse Piyasa Özeti/Tarama
  // listesinde de görünüyorsa OTOMATİK olarak orada da yansır (tek kaynak).
  const canliSemboller = useMemo(() => {
    const favSembol = hisseler.filter(h => h.favori).map(h => h.symbol);
    const portfoySembol = portfoy.map(p => p.symbol);
    const yukselecekSembol = yukselecek.slice(0, 40).map(h => h.symbol);
    const dipSembol = dipDonusu.slice(0, 40).map(h => h.symbol);
    return [...new Set([...favSembol, ...portfoySembol, ...yukselecekSembol, ...dipSembol])];
  }, [hisseler, portfoy, yukselecek, dipDonusu]);
  const canliMap = useCanliFiyatlar(canliSemboller);
  const hisselerCanli = useMemo(
    () => hisseler.map(h => canliMap[h.symbol] ? { ...h, fiyat: canliMap[h.symbol].fiyat } : h),
    [hisseler, canliMap]
  );
  const yukselecekCanli = useMemo(
    () => yukselecek.map(h => canliMap[h.symbol] ? { ...h, fiyat: canliMap[h.symbol].fiyat } : h),
    [yukselecek, canliMap]
  );
  const dipDonusuCanli = useMemo(
    () => dipDonusu.map(h => canliMap[h.symbol] ? { ...h, fiyat: canliMap[h.symbol].fiyat } : h),
    [dipDonusu, canliMap]
  );

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Masaüstü: sabit sol menü (mobilde gizli, bkz. YanNav içindeki
         md:flex). Kullanıcı isteği: "pc'de de aynı akıcı arayüzü istiyorum"
         — aynı state/aynı SPA, sadece PC'de menü sol tarafa taşınıyor. */}
      <YanNav aktif={tab} setAktif={setTab} />

      <div className="max-w-md md:max-w-3xl md:ml-56 mx-auto md:mx-0 md:px-8 pb-20 md:pb-10 md:pt-6 safe-top">
        {yukleniyor && (
          <p className="px-4 pt-3 text-xs text-gray-400">Gerçek veri yükleniyor…</p>
        )}
        {tab === 'ana' && <AnaEkran hisseler={hisselerCanli} onSec={setDetaySembol} onYildiz={yildizToggle} zaman={taramaZaman} sistemDurumu={sistemDurumu} />}
        {tab === 'tarama' && <TaramaEkran hisseler={hisselerCanli} onSec={setDetaySembol} onYildiz={yildizToggle} fonKurumsal={fonKurumsal} />}
        {tab === 'yukselecek' && <YukselecekEkran hisseler={yukselecekCanli} dipDonusu={dipDonusuCanli} onSec={setDetaySembol} zaman={taramaZaman} />}
        {tab === 'ara' && <AraEkran hisseler={hisselerCanli} onSec={setDetaySembol} onYildiz={yildizToggle} />}
        {tab === 'portfoy' && <PortfoyEkran hisseler={hisselerCanli} portfoy={portfoy} setPortfoy={setPortfoy} gercekPortfoy={gercekPortfoy} performans={performans} backtest={backtest} />}
      </div>

      {/* Masaüstünde YanNav zaten md:hidden olan AltNav'ın yerini alıyor;
         mobilde ise detay ekranı açıkken alt nav'ı DOM'da tutmaya gerek yok
         (detay tam ekran zaten üstünü kaplıyor) — orijinal davranış korundu. */}
      {!secilenHisse && <AltNav aktif={tab} setAktif={setTab} />}

      {secilenHisse && (
        <DetayEkran
          hisse={secilenHisse}
          onGeri={() => setDetaySembol(null)}
          onYildiz={yildizToggle}
          onPortfoyeEkle={portfoyeEkle}
          zamanHam={taramaZamanHam}
          akdVerisi={akdVerisi}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* ═══════════════════════════════════════════════════════════════════════
   VERİ ZİNCİRİ (gerçek, mock değil):
   arka_plan_tarama.py / gunluk_sanal_yatirim.py (Görev Zamanlayıcı veya
   GitHub Actions ile günde 1-2 kez) → tarama_onbellek.json / sanal_portfoy.json
   → pusula_veri_uret.py → docs/pusula/data/*.json → bu sayfa fetch() ile okur.

   KALAN SINIRLAMA: docs/pusula/data/portfoy.json içindeki elle ekle/çıkar
   işlemleri sadece tarayıcı state'inde yaşar (kalıcı değildir, sayfa
   yenilenince kaybolur) — gerçek sanal portföyü değiştirmek için hâlâ
   Streamlit uygulaması (app.py) kullanılmalı. Bunu kalıcı yapmak isterse
   kullanıcı, bir yazma API'si (ör. Cloudflare Worker + GitHub API commit)
   eklenebilir; şu an salt-okunur bir görünüm tercih edildi.
   ═══════════════════════════════════════════════════════════════════════ */
</script>
</body>
</html>
