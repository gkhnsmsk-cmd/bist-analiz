name: V2 Walk-Forward Backtest

# NEDEN: V2 stratejisi, şartname §8'deki kabul kriterlerini geçmeden yayına
# çıkmaz. Bu iş akışı 2019-2023 (geliştirme) ve 2024-bugün (dokunulmamış test)
# dönemlerini ayrı ayrı koşturur, sonucu repoya yazar.
# Elle tetiklenir (workflow_dispatch) — her commit'te çalışmasına gerek yok.

on:
  workflow_dispatch:
    inputs:
      ozsermaye:
        description: "Başlangıç özsermayesi (TL)"
        required: false
        default: "1000000"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Modül öz-testleri (ağ gerektirmeyenler)
        continue-on-error: true
        run: |
          cd v2
          echo "--- sinyal.py ---";   python sinyal.py   || echo "sinyal.py testi başarısız"
          echo "--- risk.py ---";     python risk.py     || echo "risk.py testi başarısız"
          echo "--- pozisyon.py ---"; python pozisyon.py || echo "pozisyon.py testi başarısız"
          echo "--- backtest.py (look-ahead sızıntı testi) ---"
          python backtest.py || echo "backtest.py öz-testi başarısız"

      - name: Walk-forward backtest
        run: |
          cd v2
          python -u calistir_backtest.py --ozsermaye "${{ github.event.inputs.ozsermaye || '1000000' }}"

      - name: Sonuçları commit et
        run: |
          git config user.name  "bist-otomasyon"
          git config user.email "bist-otomasyon@users.noreply.github.com"
          git add -A -- 'v2/sonuclar/*'
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "V2 backtest sonucu: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Özet raporu iş akışı sayfasında göster
        if: always()
        run: |
          if [ -f v2/sonuclar/ozet.md ]; then
            cat v2/sonuclar/ozet.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Özet dosyası üretilemedi." >> "$GITHUB_STEP_SUMMARY"
          fi
