name: V6 Yoğunlaştırılmış Backtest (3-5 pozisyon, yüksek güven)

# NEDEN: V2 (10+ pozisyona dağıtılmış swing) ve V3 (10 pozisyonlu aylık
# rotasyon) düşük/negatif CAGR verdi — ortalama kalitede sinyalleri çok
# sayıda pozisyona dağıtmak getiriyi seyreltiyor. V6 sinyal kalitesini
# sertleştirir (4 sert şart birden), pozisyon sayısını 3-5'e düşürür, her
# birine yüksek ağırlık (%20-33) verir. Kullanıcı hedefi (pazarlık yok):
# TEST döneminde (2024-01-01 -> bugün) CAGR>=%55, maksimum düşüş<=%25,
# profit factor>=1.3.

on:
  workflow_dispatch:
    inputs:
      ozsermaye:
        description: "Başlangıç özsermayesi (TL)"
        required: false
        default: "1000000"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Modül öz-testleri (ağ gerektirmeyenler)
        continue-on-error: true
        run: |
          cd v2
          echo "--- v6_skor.py ---";    python v6_skor.py    || echo "v6_skor testi BAŞARISIZ"
          echo "--- v6_portfoy.py ---"; python v6_portfoy.py || echo "v6_portfoy testi BAŞARISIZ"
          echo "--- rejim.py ---";      python rejim.py      || echo "rejim testi BAŞARISIZ"
          echo "--- v6_backtest.py (look-ahead testi) ---"
          python v6_backtest.py || echo "v6_backtest öz-testi BAŞARISIZ"

      - name: Walk-forward backtest (V6 + al-tut kıyası)
        run: |
          cd v2
          python -u calistir_v6.py --ozsermaye "${{ github.event.inputs.ozsermaye || '1000000' }}"

      - name: Sonuçları commit et
        run: |
          git config user.name  "bist-otomasyon"
          git config user.email "bist-otomasyon@users.noreply.github.com"
          git add -A -- 'v2/sonuclar_v6/*'
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "V6 backtest sonucu: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Özeti iş akışı sayfasında göster
        if: always()
        run: |
          if [ -f v2/sonuclar_v6/ozet.md ]; then
            cat v2/sonuclar_v6/ozet.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Özet dosyası üretilemedi." >> "$GITHUB_STEP_SUMMARY"
          fi
